# Cloudflare Worker fuer die Stufe 2 des Health Checks.
# Die Empfaenger-Adresse steht NICHT in dieser Datei (das Repo ist oeffentlich),
# sondern wird als Secret gesetzt: npx wrangler secret put TO_ADDRESS
name = "tofia-health-check"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Eigene Adresse fuer den Worker (Domain muss in deinem Cloudflare-Konto liegen)
routes = [{ pattern = "api.tofia-analytics.com", custom_domain = true }]

[vars]
FROM_ADDRESS = "noreply@tofia-analytics.com"
ALLOWED_ORIGINS = "https://tofia-analytics.com,https://www.tofia-analytics.com"
# Bestaetigungsmail an den Besucher: "on" (braucht Workers Paid + eingerichtete Absenderdomain), "off" zum Abschalten
CUSTOMER_MAIL = "on"

# Mail-Versand: Mail an dich ueber Email Routing, Bestaetigung an Besucher ueber Email Sending
[[send_email]]
name = "EMAIL"

# Logs im Cloudflare-Dashboard (Workers > tofia-health-check > Logs)
[observability]
enabled = true

# Anonyme Statistik je Absendung (siehe schema.sql und README, Abschnitt "Statistik in D1").
# database_id kommt aus: npx wrangler@latest d1 create tofia-leads
[[d1_databases]]
binding = "LEAD_DB"
database_name = "tofia-leads"
database_id = "HIER_DIE_ID_EINTRAGEN"
