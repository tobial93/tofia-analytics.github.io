<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0.5 L0,6.5 L6,3.5 z" fill="#94A3B8"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0.5 L0,6.5 L6,3.5 z" fill="#FCA5A5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="310" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="26" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E293B">Real-time E-commerce Event Pipeline</text>
  <text x="430" y="41" text-anchor="middle" font-size="9" fill="#94A3B8" letter-spacing="0.8">GCP · PUB/SUB · CLOUD RUN · BIGQUERY · DBT · TERRAFORM</text>

  <!-- ══════════════ ROW 1 ══════════════ -->

  <!-- Producer -->
  <rect x="14" y="58" width="118" height="82" rx="7" fill="#1E293B"/>
  <text x="73" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="white">Producer</text>
  <text x="73" y="97" text-anchor="middle" font-size="8.5" fill="#94A3B8">Python</text>
  <text x="73" y="109" text-anchor="middle" font-size="8" fill="#64748B">10–100 events/s</text>
  <text x="73" y="120" text-anchor="middle" font-size="8" fill="#64748B">session rotation</text>
  <text x="73" y="131" text-anchor="middle" font-size="8" fill="#64748B">4 event types</text>

  <!-- Arrow 1: Producer → Pub/Sub -->
  <line x1="132" y1="99" x2="172" y2="99" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Pub/Sub Topic -->
  <rect x="175" y="52" width="132" height="86" rx="7" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="175" y="52" width="132" height="9" rx="7" fill="#2563EB"/>
  <text x="241" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">Pub/Sub Topic</text>
  <text x="241" y="91" text-anchor="middle" font-size="8.5" fill="#3B82F6">ecommerce-events</text>
  <text x="241" y="104" text-anchor="middle" font-size="8" fill="#64748B">push subscription</text>
  <text x="241" y="115" text-anchor="middle" font-size="8" fill="#64748B">24 h message retention</text>
  <text x="241" y="128" text-anchor="middle" font-size="8" fill="#64748B">exp. backoff retry</text>

  <!-- Arrow: Pub/Sub → Cloud Run -->
  <line x1="307" y1="92" x2="351" y2="92" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="329" y="86" text-anchor="middle" font-size="7.5" fill="#94A3B8">OIDC</text>

  <!-- Dead-letter arrow (down from Pub/Sub) -->
  <line x1="241" y1="138" x2="241" y2="196" stroke="#FCA5A5" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="254" y="172" font-size="7.5" fill="#FCA5A5">5 attempts</text>

  <!-- Cloud Run Consumer -->
  <rect x="354" y="46" width="152" height="100" rx="7" fill="white" stroke="#0EA5E9" stroke-width="1.5"/>
  <rect x="354" y="46" width="152" height="9" rx="7" fill="#0EA5E9"/>
  <text x="430" y="71" text-anchor="middle" font-size="10" font-weight="700" fill="#0C4A6E">Cloud Run Consumer</text>
  <text x="430" y="84" text-anchor="middle" font-size="8.5" fill="#0369A1">FastAPI · Python</text>
  <text x="430" y="97" text-anchor="middle" font-size="8" fill="#64748B">Pydantic schema validation</text>
  <text x="430" y="109" text-anchor="middle" font-size="8" fill="#64748B">discard malformed msgs</text>
  <text x="430" y="121" text-anchor="middle" font-size="8" fill="#64748B">retry on BQ errors (500)</text>
  <text x="430" y="133" text-anchor="middle" font-size="8" fill="#64748B">0 → 10 instances</text>

  <!-- Arrow: Cloud Run → BigQuery -->
  <line x1="506" y1="96" x2="550" y2="96" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- BigQuery Raw -->
  <rect x="553" y="58" width="148" height="82" rx="7" fill="white" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="553" y="58" width="148" height="9" rx="7" fill="#7C3AED"/>
  <text x="627" y="83" text-anchor="middle" font-size="10" font-weight="700" fill="#4C1D95">BigQuery</text>
  <text x="627" y="96" text-anchor="middle" font-size="8.5" fill="#6D28D9">raw_events</text>
  <text x="627" y="109" text-anchor="middle" font-size="8" fill="#64748B">partitioned by DAY</text>
  <text x="627" y="121" text-anchor="middle" font-size="8" fill="#64748B">clustered: type · session</text>
  <text x="627" y="132" text-anchor="middle" font-size="8" fill="#64748B">streaming inserts</text>

  <!-- Arrow: BQ → BI (right) -->
  <line x1="701" y1="96" x2="740" y2="96" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- BI Consumers -->
  <rect x="743" y="68" width="100" height="60" rx="7" fill="white" stroke="#16A34A" stroke-width="1.5"/>
  <rect x="743" y="68" width="100" height="9" rx="7" fill="#16A34A"/>
  <text x="793" y="92" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532D">BI Consumers</text>
  <text x="793" y="105" text-anchor="middle" font-size="8" fill="#64748B">Looker · Power BI</text>
  <text x="793" y="116" text-anchor="middle" font-size="8" fill="#64748B">read-only SA grants</text>

  <!-- Arrow: BQ → dbt (down) -->
  <line x1="627" y1="140" x2="627" y2="193" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="641" y="170" font-size="7.5" fill="#94A3B8">every 5 min</text>

  <!-- ══════════════ ROW 2 ══════════════ -->

  <!-- Dead-letter box -->
  <rect x="175" y="198" width="132" height="58" rx="7" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="241" y="218" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991B1B">Dead-letter Topic</text>
  <text x="241" y="231" text-anchor="middle" font-size="8" fill="#DC2626">failed deliveries</text>
  <text x="241" y="244" text-anchor="middle" font-size="8" fill="#DC2626">manual inspection</text>

  <!-- dbt Marts box -->
  <rect x="354" y="195" width="490" height="88" rx="7" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <rect x="354" y="195" width="490" height="9" rx="7" fill="#EA580C"/>
  <text x="599" y="218" text-anchor="middle" font-size="10" font-weight="700" fill="#7C2D12">dbt Transformations</text>

  <!-- dbt model 1 -->
  <rect x="364" y="226" width="148" height="47" rx="5" fill="white" stroke="#FED7AA" stroke-width="1"/>
  <text x="438" y="242" text-anchor="middle" font-size="8.5" font-weight="600" fill="#7C2D12">fct_events_5min</text>
  <text x="438" y="254" text-anchor="middle" font-size="8" fill="#9A3412">5-min tumbling windows</text>
  <text x="438" y="265" text-anchor="middle" font-size="8" fill="#9A3412">counts · revenue · sessions</text>

  <!-- dbt model 2 -->
  <rect x="522" y="226" width="152" height="47" rx="5" fill="white" stroke="#FED7AA" stroke-width="1"/>
  <text x="598" y="242" text-anchor="middle" font-size="8.5" font-weight="600" fill="#7C2D12">fct_funnel_hourly</text>
  <text x="598" y="254" text-anchor="middle" font-size="8" fill="#9A3412">hourly conversion funnel</text>
  <text x="598" y="265" text-anchor="middle" font-size="8" fill="#9A3412">step rates · revenue</text>

  <!-- dbt model 3 -->
  <rect x="684" y="226" width="150" height="47" rx="5" fill="white" stroke="#FED7AA" stroke-width="1"/>
  <text x="759" y="242" text-anchor="middle" font-size="8.5" font-weight="600" fill="#7C2D12">fct_session_conversions</text>
  <text x="759" y="254" text-anchor="middle" font-size="8" fill="#9A3412">session-grain dedup</text>
  <text x="759" y="265" text-anchor="middle" font-size="8" fill="#9A3412">no retry overcounting</text>

  <!-- Terraform banner -->
  <rect x="14" y="292" width="832" height="12" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="430" y="301" text-anchor="middle" font-size="8" fill="#94A3B8" letter-spacing="0.4">TERRAFORM MANAGED  ·  dev / prd environments  ·  GCS remote state  ·  minimal IAM bindings</text>
</svg>
